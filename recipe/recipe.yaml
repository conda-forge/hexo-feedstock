context:
  version: "8.1.2"

package:
  name: hexo
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/hexo/-/hexo-${{ version }}.tgz
  sha256: 3ba063de1fb6ecfe5ec79d1f9ac3e886deb2f7c3f0b93fd063b8e1ef11ff97d2

build:
  number: 0
  noarch: generic

requirements:
  build:
    - jq
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - hexo --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A fast, simple & powerful blog framework, powered by Node.js.
  homepage: https://github.com/hexojs/hexo
  repository: https://github.com/hexojs/hexo

extra:
  recipe-maintainers:
    - danielnachun
